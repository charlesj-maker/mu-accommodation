<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MU Accommodation — Verified Boarding Houses</title>
<script>
  (function () {
    var saved = localStorage.getItem('theme');
    if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>

<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Firebase App & Firestore & Auth -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

<style>
  :root {
    --brand-blue: #1E88E5;
    --brand-blue-dark: #1565C0;
    --brand-green: #2E7D32;
    --brand-green-light: #43A047;
    --whatsapp: #25D366;
    --ink: #1A2233;
    --ink-soft: #5B6472;
    --bg: #F4F6F9;
    --card-bg: #FFFFFF;
    --border: #E2E8F0;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.06);
    --shadow-soft: 0 2px 10px rgba(0, 0, 0, 0.04);
  }

  :root[data-theme="dark"] {
    --brand-blue: #38BDF8;
    --brand-blue-dark: #0284C7;
    --brand-green: #4ADE80;
    --brand-green-light: #22C55E;
    --bg: #0F172A;
    --card-bg: #1E293B;
    --border: #334155;
    --ink: #F8FAFC;
    --ink-soft: #94A3B8;
    --shadow-card: 0 6px 24px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 0;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* Dynamic Hiding Header Bar */
  .app-bar {
    background: linear-gradient(135deg, #1565C0, #1E88E5);
    color: white;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 2px 12px rgba(21, 101, 192, 0.25);
    transition: transform 0.3s ease;
  }
  .app-bar.nav-hidden {
    transform: translateY(-100%);
  }

  .app-bar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-badge {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    color: white;
  }
  .header-title { font-weight: 800; font-size: 15px; letter-spacing: 0.5px; color: white; }
  .header-sub { font-size: 11px; opacity: 0.85; color: rgba(255,255,255,0.9); }

  .theme-toggle-btn {
    background: rgba(255,255,255,0.18);
    border: none;
    color: white;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 12px 12px 85px 12px;
  }

  /* Search & Interactive Filter Chips */
  .search-box-wrap { position: relative; margin-bottom: 10px; }
  .search-box {
    width: 100%;
    padding: 12px 14px 12px 40px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--card-bg);
    color: var(--ink);
    outline: none;
    box-shadow: var(--shadow-soft);
  }
  .search-box:focus { border-color: var(--brand-blue); }
  .search-box-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-soft);
  }

  .filters-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .filters-row::-webkit-scrollbar { display: none; }
  .filter-chip {
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: var(--shadow-soft);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .filter-chip.active {
    background: var(--brand-blue);
    color: white;
    border-color: var(--brand-blue);
  }
  .filter-chip svg { stroke: currentColor; fill: none; flex-shrink: 0; }

  /* Listing Card */
  .listing-card {
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-bottom: 18px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-card);
  }
  
  .listing-header {
    padding: 14px 14px 8px 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .listing-title { font-size: 16px; font-weight: 700; margin: 0 0 2px 0; color: var(--ink); }
  .listing-subtitle {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 0 0 6px 0;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  
  .rooms-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: #16A34A;
    background: rgba(22, 163, 74, 0.12);
    border: 1px solid rgba(22, 163, 74, 0.25);
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
  }
  .price-tag { font-size: 17px; font-weight: 800; color: var(--brand-green); text-align: right; }
  .price-tag small { font-size: 10.5px; font-weight: 500; color: var(--ink-soft); display: block; }

  /* Fast Hardware-Accelerated Photo Carousel */
  .gallery-wrap { position: relative; background: #000; }
  .listing-photo-container {
    position: relative;
    width: 100%;
    height: 220px;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x pan-y;
    scroll-behavior: smooth;
    will-change: scroll-position;
  }
  .listing-photo-container::-webkit-scrollbar { display: none; }
  .listing-img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    flex-shrink: 0;
    scroll-snap-align: start;
    cursor: zoom-in;
  }

  .listing-id-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(15, 23, 42, 0.82);
    color: white;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    backdrop-filter: blur(4px);
    z-index: 5;
  }
  .photo-counter-tag {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0, 0, 0, 0.65);
    color: white;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    z-index: 5;
  }

  /* Action Buttons & Bookmark Icon */
  .action-row { display: flex; gap: 8px; padding: 10px 14px 14px 14px; }
  .action-row a {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 6px;
    border-radius: var(--radius-sm);
    font-weight: 600;
    text-decoration: none;
    font-size: 12.5px;
    border: 1px solid transparent;
    transition: opacity 0.15s ease;
  }
  .action-row a:active { opacity: 0.8; }
  
  .btn-whatsapp { background-color: var(--whatsapp); color: white; }
  .btn-call { background-color: transparent; color: var(--brand-green); border-color: rgba(46, 125, 50, 0.3); }
  .btn-location { background-color: transparent; color: var(--brand-blue); border-color: rgba(30, 136, 229, 0.3); }

  /* Save Bookmark Button */
  .save-bookmark-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    padding: 8px 11px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }
  .save-bookmark-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; }
  .save-bookmark-btn.active {
    color: #F59E0B;
    border-color: #F59E0B;
    background: rgba(245, 158, 11, 0.12);
  }
  .save-bookmark-btn.active svg { fill: #F59E0B; }

  /* Amenities & Features Checklist */
  .amenity-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 4px 14px; }
  .amenity-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(30, 136, 229, 0.08);
    color: var(--brand-blue);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 999px;
  }
  .features-list { list-style: none; margin: 0; padding: 0 14px 10px 14px; }
  .features-list li {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .features-list li svg { color: var(--brand-green); flex-shrink: 0; }

  /* Bottom Navigation */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 8px 0 10px 0;
    z-index: 100;
    box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--ink-soft);
    font-size: 11px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    background: none;
    border: none;
    width: 25%;
  }
  .nav-item.active { color: var(--brand-blue); font-weight: 700; }
  .nav-item svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 2; }
  .nav-item.active svg { stroke: var(--brand-blue); fill: rgba(30, 136, 229, 0.12); }

  /* Clean Arrow Back Bar */
  .page-back-bar { display: flex; align-items: center; gap: 12px; padding: 10px 0 14px 0; }
  .page-back-bar button {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink);
    box-shadow: var(--shadow-soft);
  }
  .page-back-bar button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; }
  .page-back-bar span { font-weight: 700; font-size: 16px; color: var(--ink); }

  /* Auth & Profile Screens */
  .auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card {
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    padding: 28px 22px;
    max-width: 360px;
    width: 100%;
    border: 1px solid var(--border);
    text-align: center;
    box-shadow: var(--shadow-card);
  }
  .auth-logo {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--brand-blue-dark);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px auto;
    font-weight: 800;
    font-size: 16px;
  }
  .payment-input {
    width: 100%;
    padding: 11px 13px;
    font-size: 13.5px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    background: var(--bg);
    color: var(--ink);
    outline: none;
    font-family: inherit;
  }
  .payment-input:focus { border-color: var(--brand-blue); }
  .btn-primary {
    background: var(--brand-blue);
    color: white;
    border: none;
    padding: 11px;
    border-radius: var(--radius-sm);
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    width: 100%;
  }

  .profile-section {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 6px 14px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-card);
  }
  .profile-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 13.5px;
  }
  .profile-row:last-child { border-bottom: none; }

  /* Modals & Overlays */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 16px;
  }
  .overlay.hidden { display: none !important; }
  .modal-box {
    background: var(--card-bg);
    color: var(--ink);
    width: 100%;
    max-width: 400px;
    border-radius: 16px;
    padding: 20px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-card);
  }
  .modal-box h3 { margin: 0 0 12px 0; font-size: 16.5px; font-weight: 700; }

  .hidden { display: none !important; }
  .empty-state { text-align: center; color: var(--ink-soft); padding: 40px 20px; font-size: 13.5px; }

  /* Lightbox */
  .lightbox-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.95);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lightbox-overlay.hidden { display: none !important; }
  .lightbox-img { max-width: 92vw; max-height: 85vh; object-fit: contain; }
</style>
</head>
<body>

<!-- Sticky Header (Hides on Scroll Down) -->
<div class="app-bar" id="topAppBar">
  <div class="app-bar-brand">
    <div class="logo-badge">MU</div>
    <div>
      <div class="header-title">MU-ACCOMMODATION</div>
      <div class="header-sub">Listings</div>
    </div>
  </div>
  <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle dark mode">🌙</button>
</div>

<!-- Auth Screen -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">MU</div>
    <h2 id="authHeading" style="margin:0 0 4px 0; font-size:18px;">Welcome Back</h2>
    <p class="auth-subtitle" id="authSubheading" style="font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;">Sign in to browse verified boarding houses.</p>
    
    <input type="email" id="authEmail" class="payment-input" placeholder="Email address" autocomplete="email">
    <input type="password" id="authPassword" class="payment-input" placeholder="Password" autocomplete="current-password">
    
    <span style="display:block; text-align:right; font-size:12px; color:var(--brand-blue); margin:-4px 0 12px 0; cursor:pointer; text-decoration:underline;" id="forgotPasswordBtn" onclick="AuthGate.showForgotPassword()">Forgot password?</span>
    
    <div id="authError" style="color:#EF4444; font-size:12px; margin-bottom:10px; min-height:14px; text-align:left;"></div>
    
    <button class="btn-primary" onclick="AuthGate.submitEmail()" id="authSubmitBtn">Log In</button>
    <div style="margin-top:14px; font-size:12px; color:var(--ink-soft); cursor:pointer;" id="authToggleText" onclick="AuthGate.toggleMode()">Don't have an account? <strong style="color:var(--brand-blue);">Create one</strong></div>
  </div>
</div>

<!-- Main Application View -->
<div class="container hidden" id="appContent">
  
  <!-- Listings View -->
  <div id="listingsView">
    <div class="search-box-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" class="search-box" placeholder="Search boarding houses, locations..." onkeyup="applyAllFilters()">
    </div>

    <!-- Filter chips row with drop menus -->
    <div class="filters-row">
      <button class="filter-chip" id="chip-price" onclick="FilterControls.open('price')">
        <svg width="13" height="13" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        <span id="label-price">Price</span> ▾
      </button>
      <button class="filter-chip" id="chip-distance" onclick="FilterControls.open('distance')">
        <svg width="13" height="13" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="label-distance">Distance</span> ▾
      </button>
      <button class="filter-chip" id="chip-amenities" onclick="FilterControls.open('amenities')">
        <svg width="13" height="13" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span id="label-amenities">Amenities</span> ▾
      </button>
    </div>

    <div id="listingsWrapper">
      <div class="empty-state">Loading listings...</div>
    </div>
  </div>

  <!-- Details View -->
  <div id="detailsView" class="hidden"></div>

  <!-- Saved View -->
  <div id="savedView" class="hidden"></div>

  <!-- Messages View (Placeholder unwired) -->
  <div id="messagesView" class="hidden">
    <div class="empty-state">
      <h3>Messages</h3>
      <p>No active conversations yet.</p>
    </div>
  </div>

  <!-- Profile View -->
  <div id="profileView" class="hidden"></div>
</div>

<!-- Bottom Navigation Bar -->
<div class="bottom-nav hidden" id="bottomNav">
  <button class="nav-item active" id="nav-listings" onclick="navigateTo('')">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Listings</span>
  </button>
  <button class="nav-item" id="nav-saved" onclick="navigateTo('saved')">
    <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    <span>Saved</span>
  </button>
  <button class="nav-item" id="nav-messages" onclick="navigateTo('messages')">
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span>Messages</span>
  </button>
  <button class="nav-item" id="nav-profile" onclick="navigateTo('profile')">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>Profile</span>
  </button>
</div>

<!-- Filter Selector Modal -->
<div class="overlay hidden" id="filterOverlay" onclick="if(event.target===this) FilterControls.close()">
  <div class="modal-box" id="filterModalContent"></div>
</div>

<!-- Account / Password Change Modal -->
<div class="overlay hidden" id="accountOverlay" onclick="if(event.target===this) AccountMenu.close()">
  <div class="modal-box" id="accountModal"></div>
</div>

<!-- Lightbox Modal -->
<div class="lightbox-overlay hidden" id="lightboxOverlay" onclick="Lightbox.close()">
  <img class="lightbox-img" id="lightboxImg" src="" alt="Listing photo view">
</div>

<script>
  // Firebase Configuration & Initialization
  const firebaseConfig = {
    apiKey: ["AIzaSyCjAoyorXNlHxRMzkFgAyiA_1", "L_VcR-X9c"].join(''),
    authDomain: "university-homes-zambia.firebaseapp.com",
    projectId: "university-homes-zambia",
    storageBucket: "university-homes-zambia.appspot.com",
    messagingSenderId: "236985394876",
    appId: "1:236985394876:web:generated"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  const PLACEHOLDER_IMG = "https://images.unsplash.com/photo-1555854877-bab0e564b8d5?auto=format&fit=crop&w=600&q=80";

  function escapeHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function navigateTo(route) { location.hash = route; }

  // Dynamic Header Hide/Show on Scroll
  let lastScrollY = window.scrollY;
  window.addEventListener('scroll', () => {
    const topBar = document.getElementById('topAppBar');
    if (!topBar) return;
    if (window.scrollY > lastScrollY && window.scrollY > 50) {
      topBar.classList.add('nav-hidden');
    } else {
      topBar.classList.remove('nav-hidden');
    }
    lastScrollY = window.scrollY;
  }, { passive: true });

  // Theme Toggle
  function toggleTheme() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (isDark) {

  // Auth Controls & Password Reset
  const AuthGate = {
    mode: 'login', // 'login' | 'signup' | 'forgot'

    toggleMode() {
      this.mode = this.mode === 'login' ? 'signup' : 'login';
      this.updateUI();
    },

    showForgotPassword() {
      this.mode = 'forgot';
      this.updateUI();
    },

    updateUI() {
      const heading = document.getElementById('authHeading');
      const subheading = document.getElementById('authSubheading');
      const submitBtn = document.getElementById('authSubmitBtn');
      const toggleText = document.getElementById('authToggleText');
      const passInput = document.getElementById('authPassword');
      const forgotLink = document.getElementById('forgotPasswordBtn');
      document.getElementById('authError').textContent = '';

      if (this.mode === 'login') {
        heading.textContent = 'Welcome Back';
        subheading.textContent = 'Sign in to browse verified boarding houses.';
        submitBtn.textContent = 'Log In';
        toggleText.innerHTML = "Don't have an account? <strong>Create one</strong>";
        passInput.classList.remove('hidden');
        forgotLink.classList.remove('hidden');
      } else if (this.mode === 'signup') {
        heading.textContent = 'Create Account';
        subheading.textContent = 'Sign up to browse verified boarding houses.';
        submitBtn.textContent = 'Create Account';
        toggleText.innerHTML = "Already have an account? <strong>Log in</strong>";
        passInput.classList.remove('hidden');
        forgotLink.classList.add('hidden');
      } else if (this.mode === 'forgot') {
        heading.textContent = 'Reset Password';
        subheading.textContent = 'Enter your email to receive a password reset code link.';
        submitBtn.textContent = 'Send Reset Code';
        toggleText.innerHTML = "Remembered your password? <strong>Log in</strong>";
        passInput.classList.add('hidden');
        forgotLink.classList.add('hidden');
      }
    },

    async submitEmail() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const errorEl = document.getElementById('authError');
      errorEl.textContent = '';

      if (!email) {
        errorEl.textContent = 'Please enter your email address.';
        return;
      }

      try {
        if (this.mode === 'forgot') {
          await auth.sendPasswordResetEmail(email);
          alert('Password reset link sent! Please check your email inbox.');
          this.mode = 'login';
          this.updateUI();
          return;
        }

        if (!password) {
          errorEl.textContent = 'Please enter your password.';
          return;
        }

        if (this.mode === 'login') {
          await auth.signInWithEmailAndPassword(email, password);
        } else {
          const cred = await auth.createUserWithEmailAndPassword(email, password);
          await db.collection('users').doc(cred.user.uid).set({
            email,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
        }
      } catch (e) {
        errorEl.textContent = this.friendlyError(e);
      }
    },

    friendlyError(e) {
      const map = {
        'auth/user-not-found': 'No account with that email address exists.',
        'auth/wrong-password': 'Incorrect password.',
        'auth/invalid-credential': 'Incorrect email or password.',
        'auth/email-already-in-use': 'That email is already registered.',
        'auth/invalid-email': 'Please enter a valid email address.',
        'auth/weak-password': 'Password must be at least 6 characters.',
      };
      return map[e.code] || 'Something went wrong. Please try again.';
    }
  };

  function watchMyFavorites(uid) {
    if (favoritesUnsub) return;
    favoritesUnsub = db.collection('favorites')
      .where('uid', '==', uid)
      .onSnapshot((snap) => {
        favoritedIds.clear();
        snap.forEach((doc) => favoritedIds.add(doc.data().houseId));
        updateFavoriteButtons();
        if (location.hash === '#saved') renderSavedPage();
      });
  }

  async function toggleFavorite(houseId) {
    const user = auth.currentUser;
    if (!user) return;
    const docId = `${user.uid}_${houseId}`;
    const isFav = favoritedIds.has(houseId);
    try {
      if (isFav) {
        await db.collection('favorites').doc(docId).delete();
      } else {
        await db.collection('favorites').doc(docId).set({
          uid: user.uid,
          houseId,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      }
    } catch (e) {
      console.error('Save error:', e);
    }
  }

  // Split free-text amenities/features
  function parseAmenities(info) {
    const text = (info || '').toLowerCase();
    const chips = [];
    if (text.includes('wifi') || text.includes('wi-fi') || text.includes('internet')) chips.push('Wi-Fi');
    if (text.includes('water') || text.includes('borehole')) chips.push('Water');
    if (text.includes('power') || text.includes('electricity') || text.includes('solar')) chips.push('Electricity');
    if (text.includes('security') || text.includes('guard')) chips.push('Secure');
    if (text.includes('study') || text.includes('desk')) chips.push('Study Area');
    return chips;
  }

  function startListeningToListings() {
    listingsUnsub = db.collection("houses").where("pendingVerification", "==", false)
      .onSnapshot((querySnapshot) => {
        rawListings = [];
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const houseId = doc.id;
          const houseName = data.name || data.houseName || "Boarding House";
          const location = data.location || "Mulungushi Area";
          const price = parseFloat(data.price) || 0;
          const rooms = data.roomsAvailable || "Available";
          const phone = data.phone || "";
          const whatsapp = data.whatsapp || "";
          const info = data.info || "";

          let imagesArray = [];
          if (Array.isArray(data.imageUrl) && data.imageUrl.length > 0) imagesArray = data.imageUrl;
          else if (typeof data.imageUrl === 'string' && data.imageUrl) imagesArray = [data.imageUrl];
          else imagesArray = [PLACEHOLDER_IMG];

          const lat = parseFloat(data.latitude);
          const lng = parseFloat(data.longitude);
          const hasPin = !isNaN(lat) && !isNaN(lng);
          const mapUrl = hasPin ? `https://www.google.com/maps/search/?api=1&query=${lat},${lng}` : null;
          const waTarget = `https://wa.me/${whatsapp}?text=Hi, I am interested in '${houseName}'. Is it available?`;

          const houseObj = { houseId, houseName, location, price, rooms, phone, whatsapp, info, hasPin, mapUrl, imagesArray, waTarget };
          allHousesData[houseId] = houseObj;
          rawListings.push(houseObj);
        });

        applyAllFilters();
      }, (err) => {
        console.error(err);
        document.getElementById("listingsWrapper").innerHTML = "<div class='empty-state'>Failed to load listings. Check your network connection.</div>";
      });
  }

  // Combined Filter and Sort Application
  function applyAllFilters() {
    const wrapper = document.getElementById("listingsWrapper");
    if (!wrapper) return;
    const searchTerm = (document.getElementById('searchInput') ? document.getElementById('searchInput').value : '').toLowerCase();

    let list = [...rawListings];

    // 1. Text Search Filter
    if (searchTerm) {
      list = list.filter(h => (h.houseName + ' ' + h.location + ' ' + h.info).toLowerCase().includes(searchTerm));
    }

    // 2. Amenity Filter
    if (activeFilters.amenity !== 'all') {
      list = list.filter(h => {
        const ams = parseAmenities(h.info).map(a => a.toLowerCase());
        return ams.includes(activeFilters.amenity.toLowerCase());
      });
    }

    // 3. Distance/Location Filter
    if (activeFilters.distance !== 'all') {
      const target = activeFilters.distance.toLowerCase();
      list = list.filter(h => h.location.toLowerCase().includes(target) || h.info.toLowerCase().includes(target));
    }

    // 4. Price Sort
    if (activeFilters.priceSort === 'low-to-high') {
      list.sort((a, b) => a.price - b.price);
    } else if (activeFilters.priceSort === 'high-to-low') {
      list.sort((a, b) => b.price - a.price);
    }

    wrapper.innerHTML = "";
    if (list.length === 0) {
      wrapper.innerHTML = "<div class='empty-state'>No boarding houses match your current filter criteria.</div>";
      return;
    }

    list.forEach((house) => {
      const amenities = parseAmenities(house.info);
      const amenitiesHtml = amenities.length
        ? `<div class="amenity-chips">${amenities.map(a => `<span class="amenity-chip">${a}</span>`).join('')}</div>`
        : '';

      const imagesHtml = house.imagesArray
        .map((src) => `<img src="${src}" alt="Photo" class="listing-img" onclick="Lightbox.open('${src}')">`)
        .join('');

  // Router Engine
  function applyRoute() {
    const hash = location.hash.replace('#', '');
    ['listingsView', 'detailsView', 'savedView', 'messagesView', 'profileView'].forEach(v => {
      const el = document.getElementById(v);
      if (el) el.classList.add('hidden');
    });
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

    if (hash.startsWith('house-')) {
      renderDetailsPage(hash.replace('house-', ''));
      document.getElementById('detailsView').classList.remove('hidden');
    } else if (hash === 'saved') {
      renderSavedPage();
      document.getElementById('savedView').classList.remove('hidden');
      document.getElementById('nav-saved').classList.add('active');
    } else if (hash === 'messages') {
      document.getElementById('messagesView').classList.remove('hidden');
      document.getElementById('nav-messages').classList.add('active');
    } else if (hash === 'profile') {
      renderProfilePage();
      document.getElementById('profileView').classList.remove('hidden');
      document.getElementById('nav-profile').classList.add('active');
    } else {
      document.getElementById('listingsView').classList.remove('hidden');
      document.getElementById('nav-listings').classList.add('active');
    }
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', applyRoute);

        <div class="profile-row" onclick="navigateTo('messages')"><span>My Inquiries</span><span>›</span></div>
        <div class="profile-row" onclick="alert('Notifications enabled')"><span>Notifications</span><span>›</span></div>
        <div class="profile-row" onclick="window.open('https://wa.me/260776480862','_blank')"><span>Contact Admin / Help</span><span>›</span></div>
        <div class="profile-row" onclick="auth.signOut()" style="color:#EF4444;"><span>Log Out</span><span>›</span></div>
      </div>
    `;
  }

  // Password Change Modal
  const AccountMenu = {
    openChangePassword() {
      const modal = document.getElementById('accountModal');
      modal.innerHTML = `
        <h3>Change Password</h3>
        <input type="password" id="curPass" class="payment-input" placeholder="Current password">
        <input type="password" id="newPass" class="payment-input" placeholder="New password">
        <div id="accErr" style="color:#EF4444; font-size:12px; margin-bottom:10px;"></div>
        <div style="display:flex; gap:8px;">
          <button class="btn-primary" style="background:var(--border); color:var(--ink);" onclick="AccountMenu.close()">Cancel</button>
          <button class="btn-primary" onclick="AccountMenu.submitChange()">Save</button>
        </div>
      `;
      document.getElementById('accountOverlay').classList.remove('hidden');
    },
    async submitChange() {
      const cur = document.getElementById('curPass').value;
      const nw = document.getElementById('newPass').value;
      const err = document.getElementById('accErr');
      try {
        const user = auth.currentUser;
        const cred = firebase.auth.EmailAuthProvider.credential(user.email, cur);
        await user.reauthenticateWithCredential(cred);
        await user.updatePassword(nw);
        alert('Password successfully updated!');
        this.close();
      } catch (e) {
        err.textContent = 'Could not update password. Verify your current password.';
      }
    },
    close() { document.getElementById('accountOverlay').classList.add('hidden'); }
  };

  // Photo Viewer Lightbox
  const Lightbox = {
    open(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightboxOverlay').classList.remove('hidden');
    },
    close() { document.getElementById('lightboxOverlay').classList.add('hidden'); }
  };
</script>
</body>
</html>
