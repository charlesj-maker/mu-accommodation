<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MU Accommodation — Verified Boarding Houses</title>
<script>
(function(){try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
</script>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<style>
:root{--brand-blue:#1E88E5;--brand-blue-dark:#1565C0;--brand-green:#2E7D32;--whatsapp:#25D366;--ink:#1A2233;--ink-soft:#5B6472;--bg:#F4F6F9;--card-bg:#fff;--border:#E2E8F0;--radius-lg:16px;--radius-md:12px;--radius-sm:8px;--shadow-card:0 4px 20px rgba(0,0,0,.06);--shadow-soft:0 2px 10px rgba(0,0,0,.04)}
:root[data-theme="dark"]{--brand-blue:#38BDF8;--brand-blue-dark:#0284C7;--brand-green:#4ADE80;--bg:#0F172A;--card-bg:#1E293B;--border:#334155;--ink:#F8FAFC;--ink-soft:#94A3B8;--shadow-card:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);margin:0;color:var(--ink);-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
.app-bar{background:linear-gradient(135deg,#1565C0,#1E88E5);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(21,101,192,.25);transition:transform .3s ease}
.app-bar.nav-hidden{transform:translateY(-100%)}
.app-bar-brand{display:flex;align-items:center;gap:10px}
.logo-badge{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.header-title{font-weight:800;font-size:15px;letter-spacing:.5px}
.header-sub{font-size:11px;opacity:.9;cursor:pointer}
.theme-toggle-btn{background:rgba(255,255,255,.18);border:none;color:#fff;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:14px}
.container{max-width:480px;margin:0 auto;padding:12px 12px 85px}
.search-box-wrap{position:relative;margin-bottom:10px}
.search-box{width:100%;padding:12px 14px 12px 40px;font-size:14px;font-family:inherit;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card-bg);color:var(--ink);outline:none;box-shadow:var(--shadow-soft)}
.search-box:focus{border-color:var(--brand-blue)}
.search-box-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft)}
.filters-row{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.filters-row::-webkit-scrollbar{display:none}
.filter-chip{background:var(--card-bg);border:1px solid var(--border);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow-soft)}
.filter-chip.active{background:var(--brand-blue);color:#fff;border-color:var(--brand-blue)}
.listing-card{background:var(--card-bg);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:18px;border:1px solid var(--border);box-shadow:var(--shadow-card)}
.listing-header{padding:14px 14px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.listing-title{font-size:16px;font-weight:700;margin:0 0 2px}
.listing-subtitle{font-size:12px;color:var(--ink-soft);margin:0 0 6px}
.rooms-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#16A34A;background:rgba(22,163,74,.12);border:1px solid rgba(22,163,74,.25);font-weight:600;padding:3px 8px;border-radius:999px}
.price-tag{font-size:17px;font-weight:800;color:var(--brand-green);text-align:right}
.price-tag small{font-size:10.5px;font-weight:500;color:var(--ink-soft);display:block}
.gallery-wrap{position:relative;background:#000}
.listing-photo-container{width:100%;height:220px;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.listing-photo-container::-webkit-scrollbar{display:none}
.listing-img{width:100%;height:220px;object-fit:cover;flex-shrink:0;scroll-snap-align:start;cursor:zoom-in}
.listing-id-badge{position:absolute;top:10px;left:10px;background:rgba(15,23,42,.82);color:#fff;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;z-index:5}
.photo-counter-tag{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.65);color:#fff;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;z-index:5}
.gal-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:28px;height:28px;border-radius:50%;border:none;background:rgba(0,0,0,.45);color:#fff;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 0 2px}
.gal-prev{left:8px}.gal-next{right:8px}
.action-row{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 14px}
.action-row a{flex:1 1 100px;min-width:0;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border-radius:var(--radius-sm);font-weight:600;text-decoration:none;font-size:12.5px;border:1px solid transparent}
.action-row a:active{opacity:.8}
.btn-whatsapp{background:var(--whatsapp);color:#fff}
.btn-call{color:var(--brand-green);border-color:rgba(46,125,50,.3)!important}
.btn-location{color:var(--brand-blue);border-color:rgba(30,136,229,.3)!important}
.btn-details{background:var(--border);color:var(--ink)}
.save-bookmark-btn{background:transparent;border:1px solid var(--border);color:var(--ink-soft);padding:8px 11px;border-radius:var(--radius-sm);cursor:pointer;display:inline-flex;flex-shrink:0}
.save-bookmark-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.save-bookmark-btn.active{color:#F59E0B;border-color:#F59E0B;background:rgba(245,158,11,.12)}
.save-bookmark-btn.active svg{fill:#F59E0B}
.amenity-chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 4px}
.amenity-chip{background:rgba(30,136,229,.08);color:var(--brand-blue);font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card-bg);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 calc(10px + env(safe-area-inset-bottom));z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-soft);font-size:11px;font-weight:500;cursor:pointer;background:none;border:none;width:25%}
.nav-item.active{color:var(--brand-blue);font-weight:700}
.nav-item svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2}
.nav-item.active svg{fill:rgba(30,136,229,.12)}
.page-back-bar{display:flex;align-items:center;gap:12px;padding:10px 0 14px}
.page-back-bar button{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.page-back-bar button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}
.page-back-bar span{font-weight:700;font-size:16px}
.auth-screen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--card-bg);border-radius:var(--radius-lg);padding:28px 22px;max-width:360px;width:100%;border:1px solid var(--border);text-align:center;box-shadow:var(--shadow-card)}
.auth-logo{width:48px;height:48px;border-radius:12px;background:var(--brand-blue-dark);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-weight:800;font-size:16px}
.payment-input{width:100%;padding:11px 13px;font-size:13.5px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px;background:var(--bg);color:var(--ink);outline:none;font-family:inherit}
.payment-input:focus{border-color:var(--brand-blue)}
.btn-primary{background:var(--brand-blue);color:#fff;border:none;padding:11px;border-radius:var(--radius-sm);font-weight:700;font-size:13.5px;cursor:pointer;width:100%}
.profile-section{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:6px 14px;margin-bottom:14px;box-shadow:var(--shadow-card)}
.profile-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer;font-size:13.5px}
.profile-row:last-child{border-bottom:none}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-box{background:var(--card-bg);color:var(--ink);width:100%;max-width:400px;border-radius:16px;padding:20px;border:1px solid var(--border)}
.modal-box h3{margin:0 0 12px;font-size:16.5px;font-weight:700}
.empty-state{text-align:center;color:var(--ink-soft);padding:40px 20px;font-size:13.5px}
.lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:300}
.lb-track{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.lb-track::-webkit-scrollbar{display:none}
.lb-slide{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center;scroll-snap-align:center}
.lb-slide img{max-width:100%;max-height:100%;object-fit:contain}
.lb-close{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;z-index:5;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:18px;cursor:pointer}
.lb-counter{position:absolute;top:max(22px,calc(env(safe-area-inset-top) + 8px));left:50%;transform:translateX(-50%);z-index:5;color:#fff;font-size:13px;font-weight:600;background:rgba(0,0,0,.5);padding:3px 10px;border-radius:999px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:26px;line-height:1;cursor:pointer}
.lb-prev{left:10px}.lb-next{right:10px}
</style>
</head>
<body>

<div class="app-bar hidden" id="topAppBar">
  <div class="app-bar-brand">
    <div class="logo-badge">MU</div>
    <div>
      <div class="header-title">MU-ACCOMMODATION</div>
      <div class="header-sub" id="headerSub" onclick="UniPicker.open()">Listings</div>
    </div>
  </div>
  <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle dark mode">🌙</button>
</div>

<!-- Auth -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">MU</div>
    <h2 id="authHeading" style="margin:0 0 4px;font-size:18px">Welcome Back</h2>
    <p id="authSubheading" style="font-size:12.5px;color:var(--ink-soft);margin-bottom:16px">Sign in to browse verified boarding houses.</p>
    <input type="email" inputmode="email" id="authEmail" class="payment-input" placeholder="Email address" autocomplete="email">
    <input type="password" id="authPassword" class="payment-input" placeholder="Password" autocomplete="current-password">
    <span style="display:block;text-align:right;font-size:12px;color:var(--brand-blue);margin:-4px 0 12px;cursor:pointer;text-decoration:underline" id="forgotPasswordBtn" onclick="AuthGate.showForgotPassword()">Forgot password?</span>
    <div id="authError" style="color:#EF4444;font-size:12px;margin-bottom:10px;min-height:14px;text-align:left"></div>
    <button class="btn-primary" onclick="AuthGate.submitEmail()" id="authSubmitBtn">Log In</button>
    <div style="margin-top:14px;font-size:12px;color:var(--ink-soft);cursor:pointer" id="authToggleText" onclick="AuthGate.toggleMode()">Don't have an account? <strong style="color:var(--brand-blue)">Create one</strong></div>
  </div>
</div>

<!-- University chooser -->
<div class="auth-screen hidden" id="uniScreen">
  <div class="auth-card" style="max-width:420px;text-align:left">
    <div class="auth-logo">🎓</div>
    <h2 style="margin:0 0 4px;font-size:18px;text-align:center">Choose your university</h2>
    <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;text-align:center">We're adding more universities soon.</p>
    <input type="text" id="uniSearch" class="payment-input" placeholder="Search university..." oninput="UniPicker.render()">
    <div id="uniList"></div>
  </div>
</div>

<!-- App -->
<div class="container hidden" id="appContent">
  <div id="listingsView">
    <div class="search-box-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" class="search-box" placeholder="Search boarding houses, locations..." oninput="applyAllFilters()">
    </div>
    <div class="filters-row">
      <button class="filter-chip" id="chip-price" onclick="FilterControls.open('price')"><span id="label-price">Price</span> ▾</button>
      <button class="filter-chip" id="chip-distance" onclick="FilterControls.open('distance')"><span id="label-distance">Distance</span> ▾</button>
      <button class="filter-chip" id="chip-amenities" onclick="FilterControls.open('amenities')"><span id="label-amenities">Amenities</span> ▾</button>
    </div>
    <div id="listingsWrapper"><div class="empty-state">Loading listings...</div></div>
  </div>
  <div id="detailsView" class="hidden"></div>
  <div id="savedView" class="hidden"></div>
  <div id="messagesView" class="hidden"><div class="empty-state"><h3>Messages</h3><p>No active conversations yet.</p></div></div>
  <div id="profileView" class="hidden"></div>
</div>

<div class="bottom-nav hidden" id="bottomNav">
  <button class="nav-item active" id="nav-listings" onclick="navigateTo('')"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Listings</span></button>
  <button class="nav-item" id="nav-saved" onclick="navigateTo('saved')"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span>Saved</span></button>
  <button class="nav-item" id="nav-messages" onclick="navigateTo('messages')"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Messages</span></button>
  <button class="nav-item" id="nav-profile" onclick="navigateTo('profile')"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profile</span></button>
</div>

<div class="overlay hidden" id="filterOverlay" onclick="if(event.target===this)FilterControls.close()"><div class="modal-box" id="filterModalContent"></div></div>
<div class="overlay hidden" id="accountOverlay" onclick="if(event.target===this)AccountMenu.close()"><div class="modal-box" id="accountModal"></div></div>

<div class="lightbox-overlay hidden" id="lightboxOverlay">
  <button class="lb-close" onclick="Lightbox.close()" aria-label="Close">✕</button>
  <div class="lb-counter" id="lbCounter"></div>
  <button class="lb-nav lb-prev" id="lbPrev" onclick="Lightbox.step(-1)" aria-label="Previous">‹</button>
  <div class="lb-track" id="lbTrack"></div>
  <button class="lb-nav lb-next" id="lbNext" onclick="Lightbox.step(1)" aria-label="Next">›</button>
</div>

<script>
const firebaseConfig = {
  apiKey: ["AIzaSyCjAoyorXNlHxRMzkFgAyiA_1", "L_VcR-X9c"].join(''),
  authDomain: "university-homes-zambia.firebaseapp.com",
  projectId: "university-homes-zambia",
  storageBucket: "university-homes-zambia.appspot.com",
  messagingSenderId: "236985394876",
  appId: "1:236985394876:web:generated"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

const PLACEHOLDER_IMG = "https://images.unsplash.com/photo-1555854877-bab0e564b8d5?auto=format&fit=crop&w=600&q=80";
const $ = (id) => document.getElementById(id);
const CHROME = ['appContent', 'bottomNav', 'topAppBar'];
const BACK_SVG = '<svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>';
const BOOKMARK_SVG = '<svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function navigateTo(r) { location.hash = r; }

// Header hide on scroll
let lastY = window.scrollY;
window.addEventListener('scroll', () => {
  const bar = $('topAppBar');
  if (window.scrollY > lastY && window.scrollY > 50) bar.classList.add('nav-hidden');
  else bar.classList.remove('nav-hidden');
  lastY = window.scrollY;
}, { passive: true });

// Theme
function toggleTheme() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (dark) document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', 'dark');
  try { localStorage.setItem('theme', dark ? 'light' : 'dark'); } catch (e) {}
  updateThemeIcon();
}
function updateThemeIcon() { $('themeToggleBtn').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙'; }
updateThemeIcon();

// Universities
const UNIVERSITIES = [
  { id:'mulungushi', name:'Mulungushi University', short:'MU', active:true },
  { id:'unza', name:'University of Zambia', short:'UNZA', active:false },
  { id:'cbu', name:'Copperbelt University', short:'CBU', active:false },
  { id:'mukuba', name:'Mukuba University', short:'Mukuba', active:false },
  { id:'knu', name:'Kwame Nkrumah University', short:'KNU', active:false },
  { id:'zut', name:'Zambia University of Technology', short:'ZUT', active:false },
  { id:'chalimbana', name:'Chalimbana University', short:'Chalimbana', active:false },
  { id:'cavendish', name:'Cavendish University Zambia', short:'Cavendish', active:false },
  { id:'icu', name:'Information and Communications University', short:'ICU', active:false },
  { id:'rusangu', name:'Rusangu University', short:'Rusangu', active:false },
  { id:'northrise', name:'Northrise University', short:'Northrise', active:false },
  { id:'zaou', name:'Zambian Open University', short:'ZAOU', active:false }
];
function getStoredUni() { try { return localStorage.getItem('university'); } catch (e) { return null; } }
function storeUni(id) { try { id ? localStorage.setItem('university', id) : localStorage.removeItem('university'); } catch (e) {} }
let currentUni = getStoredUni();
function getUniObj() { return UNIVERSITIES.find(u => u.id === currentUni); }

const UniPicker = {
  open() {
    CHROME.forEach(id => $(id).classList.add('hidden'));
    $('uniScreen').classList.remove('hidden');
    $('uniSearch').value = '';
    this.render();
  },
  render() {
    const q = $('uniSearch').value.toLowerCase();
    const list = UNIVERSITIES.filter(u => (u.name + ' ' + u.short).toLowerCase().includes(q));
    $('uniList').innerHTML = list.map(u => `
      <div class="profile-row" onclick="UniPicker.choose('${u.id}')">
        <div><strong>${u.name}</strong><div style="font-size:12px;color:var(--ink-soft)">${u.short}</div></div>
        ${u.active ? '<span class="rooms-chip">Live</span>' : '<span style="font-size:11px;color:var(--ink-soft)">Coming soon</span>'}
      </div>`).join('') || '<div class="empty-state">No university found.</div>';
  },
  choose(id) {
    if (id !== currentUni) {
      if (listingsUnsub) { listingsUnsub(); listingsUnsub = null; }
      rawListings = [];
      Object.keys(allHousesData).forEach(k => delete allHousesData[k]);
    }
    currentUni = id;
    storeUni(id);
    enterApp();
  }
};

function enterApp() {
  $('uniScreen').classList.add('hidden');
  CHROME.forEach(id => $(id).classList.remove('hidden'));
  const uni = getUniObj();
  $('headerSub').textContent = uni.short + ' ▾';
  if (uni.active && !listingsUnsub) startListeningToListings();
  applyAllFilters();
  applyRoute();
}

function logout() {
  storeUni(null);
  currentUni = null;
  if (listingsUnsub) { listingsUnsub(); listingsUnsub = null; }
  if (favoritesUnsub) { favoritesUnsub(); favoritesUnsub = null; }
  favoritedIds.clear();
  rawListings = [];
  Object.keys(allHousesData).forEach(k => delete allHousesData[k]);
  location.hash = '';
  auth.signOut();
}

// Filters
const activeFilters = { priceSort: 'default', distance: 'all', amenity: 'all' };
const DISTANCE_OPTS = { all:['All Areas',[]], gate1:['Near Main Gate 1',['gate 1','gate1','main gate']], gate2:['Near Gate 2',['gate 2','gate2']], eugelion:['Near Eugelion Church',['eugelion']] };
const AMENITY_OPTS = { all:'All Amenities', wifi:'Wi-Fi', water:'Water', electricity:'Electricity / Solar', secure:'Security', study:'Study Area' };
const AMENITY_KEY = { 'Wi-Fi':'wifi', 'Water':'water', 'Electricity':'electricity', 'Secure':'secure', 'Study Area':'study' };

const FilterControls = {
  row(fn, label, on) { return `<div class="profile-row" onclick="${fn}"><span>${label}</span> ${on ? '✓' : ''}</div>`; },
  open(type) {
    let h = '';
    if (type === 'price') {
      h = '<h3>Sort by Price</h3>' +
        this.row("FilterControls.setPrice('default')", 'Default Order', activeFilters.priceSort === 'default') +
        this.row("FilterControls.setPrice('low-to-high')", 'Price: Low to High', activeFilters.priceSort === 'low-to-high') +
        this.row("FilterControls.setPrice('high-to-low')", 'Price: High to Low', activeFilters.priceSort === 'high-to-low');
    } else if (type === 'distance') {
      h = '<h3>Filter by Area</h3>' + Object.keys(DISTANCE_OPTS).map(k => this.row(`FilterControls.setDistance('${k}')`, DISTANCE_OPTS[k][0], activeFilters.distance === k)).join('');
    } else {
      h = '<h3>Filter by Amenities</h3>' + Object.keys(AMENITY_OPTS).map(k => this.row(`FilterControls.setAmenity('${k}')`, AMENITY_OPTS[k], activeFilters.amenity === k)).join('');
    }
    $('filterModalContent').innerHTML = h + '<button class="btn-primary" style="margin-top:14px" onclick="FilterControls.close()">Done</button>';
    $('filterOverlay').classList.remove('hidden');
  },
  close() { $('filterOverlay').classList.add('hidden'); },
  setPrice(v) {
    activeFilters.priceSort = v;
    $('chip-price').classList.toggle('active', v !== 'default');
    $('label-price').textContent = v === 'default' ? 'Price' : (v === 'low-to-high' ? 'Low-High' : 'High-Low');
    this.close(); applyAllFilters();
  },
  setDistance(v) {
    activeFilters.distance = v;
    $('chip-distance').classList.toggle('active', v !== 'all');
    $('label-distance').textContent = v === 'all' ? 'Distance' : DISTANCE_OPTS[v][0].replace('Near ', '');
    this.close(); applyAllFilters();
  },
  setAmenity(v) {
    activeFilters.amenity = v;
    $('chip-amenities').classList.toggle('active', v !== 'all');
    $('label-amenities').textContent = v === 'all' ? 'Amenities' : AMENITY_OPTS[v];
    this.close(); applyAllFilters();
  }
};

// Auth
const AuthGate = {
  mode: 'login',
  toggleMode() { this.mode = this.mode === 'login' ? 'signup' : 'login'; this.updateUI(); },
  showForgotPassword() { this.mode = 'forgot'; this.updateUI(); },
  updateUI() {
    $('authError').textContent = '';
    const pass = $('authPassword'), forgot = $('forgotPasswordBtn');
    if (this.mode === 'login') {
      $('authHeading').textContent = 'Welcome Back';
      $('authSubheading').textContent = 'Sign in to browse verified boarding houses.';
      $('authSubmitBtn').textContent = 'Log In';
      $('authToggleText').innerHTML = "Don't have an account? <strong style='color:var(--brand-blue)'>Create one</strong>";
      pass.classList.remove('hidden'); forgot.classList.remove('hidden');
      pass.autocomplete = 'current-password';
    } else if (this.mode === 'signup') {
      $('authHeading').textContent = 'Create Account';
      $('authSubheading').textContent = 'Sign up to browse verified boarding houses.';
      $('authSubmitBtn').textContent = 'Create Account';
      $('authToggleText').innerHTML = "Already have an account? <strong style='color:var(--brand-blue)'>Log in</strong>";
      pass.classList.remove('hidden'); forgot.classList.add('hidden');
      pass.autocomplete = 'new-password';
    } else {
      $('authHeading').textContent = 'Reset Password';
      $('authSubheading').textContent = 'Enter your email to receive a password reset link.';
      $('authSubmitBtn').textContent = 'Send Reset Link';
      $('authToggleText').innerHTML = "Remembered your password? <strong style='color:var(--brand-blue)'>Log in</strong>";
      pass.classList.add('hidden'); forgot.classList.add('hidden');
    }
  },
  async submitEmail() {
    const email = $('authEmail').value.trim();
    const password = $('authPassword').value;
    const err = $('authError');
    err.textContent = '';
    if (!email) { err.textContent = 'Please enter your email address.'; return; }
    try {
      if (this.mode === 'forgot') {
        await auth.sendPasswordResetEmail(email);
        alert('Password reset link sent! Please check your email inbox.');
        this.mode = 'login'; this.updateUI(); return;
      }
      if (!password) { err.textContent = 'Please enter your password.'; return; }
      if (this.mode === 'login') {
        await auth.signInWithEmailAndPassword(email, password);
      } else {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await db.collection('users').doc(cred.user.uid).set({ email, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      }
    } catch (e) { err.textContent = this.friendlyError(e); }
  },
  friendlyError(e) {
    return ({
      'auth/user-not-found': 'No account with that email address exists.',
      'auth/wrong-password': 'Incorrect password.',
      'auth/invalid-credential': 'Incorrect email or password.',
      'auth/email-already-in-use': 'That email is already registered.',
      'auth/invalid-email': 'Please enter a valid email address.',
      'auth/weak-password': 'Password must be at least 6 characters.'
    })[e.code] || 'Something went wrong. Please try again.';
  }
};

// Favorites
let favoritesUnsub = null;
const favoritedIds = new Set();
function watchMyFavorites(uid) {
  if (favoritesUnsub) return;
  favoritesUnsub = db.collection('favorites').where('uid', '==', uid).onSnapshot((snap) => {
    favoritedIds.clear();
    snap.forEach((d) => favoritedIds.add(d.data().houseId));
    updateFavoriteButtons();
    if (location.hash === '#saved') renderSavedPage();
  });
}
async function toggleFavorite(houseId) {
  const user = auth.currentUser;
  if (!user) return;
  const ref = db.collection('favorites').doc(`${user.uid}_${houseId}`);
  try {
    if (favoritedIds.has(houseId)) await ref.delete();
    else await ref.set({ uid: user.uid, houseId, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
  } catch (e) { console.error('Save error:', e); }
}
function updateFavoriteButtons() {
  document.querySelectorAll('[data-favorite-id]').forEach((el) => el.classList.toggle('active', favoritedIds.has(el.dataset.favoriteId)));
}

// Listings
const allHousesData = {};
let rawListings = [];
let listingsUnsub = null;

auth.onAuthStateChanged((user) => {
  if (user) {
    $('authScreen').classList.add('hidden');
    watchMyFavorites(user.uid);
    if (getUniObj()) enterApp(); else UniPicker.open();
  } else {
    $('authScreen').classList.remove('hidden');
    $('uniScreen').classList.add('hidden');
    CHROME.forEach(id => $(id).classList.add('hidden'));
  }
});

function parseAmenities(info) {
  const t = (info || '').toLowerCase(), c = [];
  if (/wifi|wi-fi|internet/.test(t)) c.push('Wi-Fi');
  if (/water|borehole/.test(t)) c.push('Water');
  if (/power|electricity|solar/.test(t)) c.push('Electricity');
  if (/security|guard/.test(t)) c.push('Secure');
  if (/study|desk/.test(t)) c.push('Study Area');
  return c;
}

function startListeningToListings() {
  listingsUnsub = db.collection("houses").where("pendingVerification", "==", false).onSnapshot((snap) => {
    rawListings = [];
    snap.forEach((doc) => {
      const d = doc.data(), houseId = doc.id;
      const houseName = d.name || d.houseName || "Boarding House";
      let imgs = [];
      if (Array.isArray(d.imageUrl) && d.imageUrl.length) imgs = d.imageUrl;
      else if (typeof d.imageUrl === 'string' && d.imageUrl) imgs = [d.imageUrl];
      else imgs = [PLACEHOLDER_IMG];
      const lat = parseFloat(d.latitude), lng = parseFloat(d.longitude);
      const hasPin = !isNaN(lat) && !isNaN(lng);
      const whatsapp = String(d.whatsapp || '').replace(/[^\d]/g, '');
      const obj = {
        houseId, houseName,
        location: d.location || "Mulungushi Area",
        price: parseFloat(d.price) || 0,
        rooms: d.roomsAvailable || "Available",
        phone: String(d.phone || '').replace(/[^\d+]/g, ''),
        whatsapp, info: d.info || "", hasPin,
        mapUrl: hasPin ? `https://www.google.com/maps/search/?api=1&query=${lat},${lng}` : null,
        imagesArray: imgs,
        waTarget: whatsapp ? `https://wa.me/${whatsapp}?text=${encodeURIComponent("Hi, I am interested in '" + houseName + "'. Is it available?")}` : null
      };
      allHousesData[houseId] = obj;
      rawListings.push(obj);
    });
    applyAllFilters();
    if (location.hash.startsWith('#house-')) renderDetailsPage(location.hash.slice(7));
    if (location.hash === '#saved') renderSavedPage();
  }, (err) => {
    console.error(err);
    $("listingsWrapper").innerHTML = "<div class='empty-state'>Failed to load listings. Check your network connection.</div>";
  });
}

const Gallery = {
  scroll(btn, dir) {
    const c = btn.parentElement.querySelector('.listing-photo-container');
    c.scrollBy({ left: c.clientWidth * dir, behavior: 'smooth' });
  }
};

function galleryHtml(h) {
  const n = h.imagesArray.length;
  return `<div class="gallery-wrap">
    <div class="listing-photo-container">${h.imagesArray.map((s, i) => `<img src="${escapeHtml(s)}" alt="Photo" loading="lazy" class="listing-img" onclick="Lightbox.open('${h.houseId}',${i})">`).join('')}</div>
    <div class="listing-id-badge">ID: BH-${escapeHtml(h.houseId.slice(0, 4).toUpperCase())}</div>
    <div class="photo-counter-tag">📷 ${n}</div>
    ${n > 1 ? `<button class="gal-arrow gal-prev" onclick="Gallery.scroll(this,-1)" aria-label="Previous photo">‹</button><button class="gal-arrow gal-next" onclick="Gallery.scroll(this,1)" aria-label="Next photo">›</button>` : ''}
  </div>`;
}

function actionButtons(h, withDetails) {
  return `<div class="action-row">
    ${h.waTarget ? `<a href="${escapeHtml(h.waTarget)}" target="_blank" rel="noopener" class="btn-whatsapp">WhatsApp</a>` : ''}
    ${h.phone ? `<a href="tel:${escapeHtml(h.phone)}" class="btn-call">Call Landlord</a>` : ''}
    ${h.hasPin ? `<a href="${escapeHtml(h.mapUrl)}" target="_blank" rel="noopener" class="btn-location">Location</a>` : ''}
    ${withDetails ? `<a href="#house-${escapeHtml(h.houseId)}" class="btn-details">Details</a>` : ''}
  </div>`;
}

function applyAllFilters() {
  const wrapper = $("listingsWrapper");
  if (!wrapper) return;
  const uni = getUniObj();
  if (uni && !uni.active) {
    wrapper.innerHTML = `<div class="empty-state"><div style="font-size:34px;margin-bottom:8px">🏠</div><strong>${uni.name}</strong><p>Boarding houses for this university are coming soon.</p><button class="btn-primary" style="max-width:220px" onclick="UniPicker.open()">Choose another university</button></div>`;
    return;
  }
  const term = $('searchInput').value.toLowerCase();
  let list = [...rawListings];
  if (term) list = list.filter(h => (h.houseName + ' ' + h.location + ' ' + h.info).toLowerCase().includes(term));
  if (activeFilters.amenity !== 'all') list = list.filter(h => parseAmenities(h.info).some(a => AMENITY_KEY[a] === activeFilters.amenity));
  if (activeFilters.distance !== 'all') {
    const terms = DISTANCE_OPTS[activeFilters.distance][1];
    list = list.filter(h => terms.some(t => (h.location + ' ' + h.info).toLowerCase().includes(t)));
  }
  if (activeFilters.priceSort === 'low-to-high') list.sort((a, b) => a.price - b.price);
  else if (activeFilters.priceSort === 'high-to-low') list.sort((a, b) => b.price - a.price);

  if (!list.length) {
    wrapper.innerHTML = "<div class='empty-state'>No boarding houses match your search.</div>";
    return;
  }
  wrapper.innerHTML = list.map(h => {
    const ams = parseAmenities(h.info);
    return `<div class="listing-card">
      ${galleryHtml(h)}
      <div class="listing-header">
        <div>
          <div class="listing-title">${escapeHtml(h.houseName)}</div>
          <div class="listing-subtitle">📍 ${escapeHtml(h.location)}</div>
          <span class="rooms-chip">🟢 ${escapeHtml(h.rooms)} Rooms Available</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          <button class="save-bookmark-btn" data-favorite-id="${escapeHtml(h.houseId)}" onclick="toggleFavorite('${h.houseId}')" aria-label="Save">${BOOKMARK_SVG}</button>
          <div class="price-tag">K${escapeHtml(h.price)}<small>/ month</small></div>
        </div>
      </div>
      ${ams.length ? `<div class="amenity-chips">${ams.map(a => `<span class="amenity-chip">${a}</span>`).join('')}</div>` : ''}
      ${actionButtons(h, true)}
    </div>`;
  }).join('');
  updateFavoriteButtons();
}

// Router
function applyRoute() {
  const hash = location.hash.replace('#', '');
  ['listingsView', 'detailsView', 'savedView', 'messagesView', 'profileView'].forEach(v => $(v).classList.add('hidden'));
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  if (hash.startsWith('house-')) {
    renderDetailsPage(hash.slice(6));
    $('detailsView').classList.remove('hidden');
  } else if (hash === 'saved') {
    renderSavedPage(); $('savedView').classList.remove('hidden'); $('nav-saved').classList.add('active');
  } else if (hash === 'messages') {
    $('messagesView').classList.remove('hidden'); $('nav-messages').classList.add('active');
  } else if (hash === 'profile') {
    renderProfilePage(); $('profileView').classList.remove('hidden'); $('nav-profile').classList.add('active');
  } else {
    $('listingsView').classList.remove('hidden'); $('nav-listings').classList.add('active');
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => { if (auth.currentUser && getUniObj()) applyRoute(); });

function renderDetailsPage(houseId) {
  const view = $('detailsView'), h = allHousesData[houseId];
  const back = `<div class="page-back-bar"><button onclick="history.back()">${BACK_SVG}</button><span>${h ? escapeHtml(h.houseName) : 'Listing'}</span></div>`;
  if (!h) { view.innerHTML = back + `<div class="empty-state">Loading listing...</div>`; return; }
  view.innerHTML = back + `
    <div class="listing-card">
      ${galleryHtml(h)}
      <div style="padding:14px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div>
            <h2 style="margin:0 0 4px;font-size:18px">${escapeHtml(h.houseName)}</h2>
            <p style="color:var(--ink-soft);font-size:13px;margin:0">📍 ${escapeHtml(h.location)}</p>
          </div>
          <button class="save-bookmark-btn" data-favorite-id="${escapeHtml(houseId)}" onclick="toggleFavorite('${houseId}')">${BOOKMARK_SVG}</button>
        </div>
        <div class="price-tag" style="text-align:left;margin:12px 0 6px">K${escapeHtml(h.price)} / month</div>
        <span class="rooms-chip">🟢 ${escapeHtml(h.rooms)} Rooms Available</span>
        <p style="font-size:13px;line-height:1.6;color:var(--ink-soft);margin-top:12px;white-space:pre-line">${escapeHtml(h.info)}</p>
      </div>
      ${actionButtons(h, false)}
    </div>`;
  updateFavoriteButtons();
}

function renderSavedPage() {
  const saved = Array.from(favoritedIds).map(id => allHousesData[id]).filter(Boolean);
  const html = saved.length ? saved.map(h => `
    <div class="profile-row" onclick="navigateTo('house-${h.houseId}')">
      <div style="display:flex;align-items:center;gap:12px">
        <img src="${escapeHtml(h.imagesArray[0])}" alt="" style="width:52px;height:52px;object-fit:cover;border-radius:8px">
        <div><strong style="font-size:14px">${escapeHtml(h.houseName)}</strong><div style="font-size:12px;color:var(--ink-soft)">K${escapeHtml(h.price)} / month</div></div>
      </div><span>›</span>
    </div>`).join('') : '<div class="empty-state">No saved boarding houses yet. Bookmark listings to view them here.</div>';
  $('savedView').innerHTML = `<div class="page-back-bar"><button onclick="navigateTo('')">${BACK_SVG}</button><span>Saved Boarding Houses</span></div><div class="profile-section">${html}</div>`;
}

function renderProfilePage() {

  $('profileView').innerHTML = `
    <div class="page-back-bar"><button onclick="navigateTo('')">${BACK_SVG}</button><span>Profile</span></div>
    <div class="profile-section" style="padding:16px">
      <div style="font-weight:700;font-size:15px">${escapeHtml(user ? user.email : '')}</div>

    </div>

      <div class="profile-row" onclick="navigateTo('saved')"><span>Saved Boarding Houses</span><span>›</span></div>
      <div class="profile-row" onclick="alert('Feature coming soon')"><span>Recently Viewed</span><span>›</span></div>
      <div class="profile-row" onclick="navigateTo('messages')"><span>My Inquiries</span><span>›</span></div>
      <div class="profile-row" onclick="alert('Notifications enabled')"><span>Notifications</span><span>›</span></div>
      <div class="profile-row" onclick="window.open('https://wa.me/260776480862','_blank')"><span>Contact Admin / Help</span><span>›</span></div>
      <div class="profile-row" onclick="UniPicker.open()"><span>Change University</span><span>›</span></div>
      <div class="profile-row" onclick="logout()" style="color:#EF4444"><span>Log Out</span><span>›</span></div>
    </div>`;

const AccountMenu = {
  openChangePassword() {
    $('accountModal').innerHTML = `
      <h3>Change Password</h3>
      <input type="password" id="curPass" class="payment-input" placeholder="Current password" autocomplete="current-password">
      <input type="password" id="newPass" class="payment-input" placeholder="New password" autocomplete="new-password">
      <div id="accErr" style="color:#EF4444;font-size:12px;margin-bottom:10px"></div>
      <div style="display:flex;gap:8px">
        <button class="btn-primary" style="background:var(--border);color:var(--ink)" onclick="AccountMenu.close()">Cancel</button>
        <button class="btn-primary" onclick="AccountMenu.submitChange()">Save</button>
      </div>`;
    $('accountOverlay').classList.remove('hidden');
  },
  async submitChange() {
    try {
      const user = auth.currentUser;
      const cred = firebase.auth.EmailAuthProvider.credential(user.email, $('curPass').value);
      await user.reauthenticateWithCredential(cred);
      await user.updatePassword($('newPass').value);
      alert('Password successfully updated!');
      this.close();
    } catch (e) { $('accErr').textContent = 'Could not update password. Verify your current password.'; }
  },
  close() { $('accountOverlay').classList.add('hidden'); }
};

// Lightbox (swipe, arrows, close button, phone back button)
const Lightbox = {
  index: 0, count: 0,
  open(houseId, i) {
    const h = allHousesData[houseId];
    if (!h) return;
    const track = $('lbTrack');
    track.innerHTML = h.imagesArray.map(s => `<div class="lb-slide"><img src="${escapeHtml(s)}" alt="Listing photo"></div>`).join('');
    this.count = h.imagesArray.length;
    this.index = i || 0;
    $('lightboxOverlay').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    track.style.scrollBehavior = 'auto';
    track.scrollLeft = track.clientWidth * this.index;
    track.style.scrollBehavior = 'smooth';
    track.onscroll = () => { this.index = Math.round(track.scrollLeft / track.clientWidth); this.updateUI(); };
    this.updateUI();
    history.pushState({ lightbox: true }, '');
  },
  step(n) {
    const track = $('lbTrack');
    const next = Math.max(0, Math.min(this.count - 1, this.index + n));
    track.scrollTo({ left: track.clientWidth * next, behavior: 'smooth' });
  },
  updateUI() {
    $('lbCounter').textContent = `${this.index + 1} / ${this.count}`;
    $('lbPrev').classList.toggle('hidden', this.count < 2 || this.index === 0);
    $('lbNext').classList.toggle('hidden', this.count < 2 || this.index === this.count - 1);
  },
  hide() { $('lightboxOverlay').classList.add('hidden'); document.body.style.overflow = ''; },
  close() { if (history.state && history.state.lightbox) history.back(); else this.hide(); }
};
window.addEventListener('popstate', () => Lightbox.hide());
document.addEventListener('keydown', (e) => {
  if ($('lightboxOverlay').classList.contains('hidden')) return;
  if (e.key === 'Escape') Lightbox.close();
  if (e.key === 'ArrowLeft') Lightbox.step(-1);
  if (e.key === 'ArrowRight') Lightbox.step(1);
});
</script>
